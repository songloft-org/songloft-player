name: songloft_flutter
description: Songloft - 跨平台音乐播放器
publish_to: 'none'
version: 2.11.6+1
license: Apache-2.0

environment:
  sdk: ^3.7.0
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  # 国际化（中英文切换）
  flutter_localizations:
    sdk: flutter
  # 状态管理
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  # 路由
  go_router: ^17.1.0
  # HTTP
  dio: ^5.7.0
  # 音频播放
  just_audio: ^0.10.5
  just_audio_platform_interface: any  # SongloftMediaKitPlayer 实现 AudioPlayerPlatform
  synchronized: ^3.4.0  # songloft_web_audio_player（vendoring 自 just_audio_web）直接引用
  just_audio_media_kit: ^2.0.0  # Windows/Linux 平台的 just_audio 后端（libmpv）
  media_kit: any  # EQ 均衡器需要直接访问 NativePlayer 设置 mpv 音频滤镜
  media_kit_video: any  # 视频画面渲染（VideoController + Video widget，songloft-org/songloft#76）
  media_kit_libs_windows_video: any  # Windows 平台 media_kit 视频库（含视频输出，取代 audio 变体）
  media_kit_libs_macos_video: any    # macOS media_kit 视频库（阶段三，AudioBackend 开关默认关）
  media_kit_libs_ios_video: any      # iOS media_kit 视频库（阶段四，默认关）
  media_kit_libs_android_video: any  # Android media_kit 视频库（阶段四，默认关）
  # Linux 走系统 libmpv（完整版，已支持视频输出），无需单独 libs 包
  audio_service: ^0.18.17
  audio_service_mpris: ^0.2.1  # Linux MPRIS 媒体键支持
  audio_session: ^0.2.3
  smtc_windows: ^1.1.0  # Windows 系统媒体传输控件
  # 权限管理
  permission_handler: ^12.0.1
  # 本地存储
  shared_preferences: ^2.3.4
  path_provider: ^2.1.0
  # 图片缓存
  cached_network_image: ^3.4.1
  # 显式声明以使用 ImageRenderMethodForWeb（cached_network_image 未 re-export 该枚举）
  cached_network_image_platform_interface: ^4.1.1
  # 颜色提取
  palette_generator: ^0.3.3+4
  # UI
  # 文件选择
  file_picker: ^10.3.10
  # 日志导出：打包 zip + 系统分享
  archive: ^3.6.1
  share_plus: ^10.1.4
  # 工具
  intl: ^0.20.2
  url_launcher: ^6.3.1
  flutter_markdown: ^0.7.6
  # WebView（用于应用内加载插件页面）
  flutter_inappwebview: ^6.1.5
  # WebF：native 平台插件页的备选渲染引擎（songloft-org/songloft#341）。
  # ⚠️ GPL-3.0-only，且 LICENSE 里的 OpenWebF Enterprise Exception 仅对付费
  # 订阅者生效、无 LGPL 式链接例外 —— 引入后本客户端**分发的二进制整体**按
  # GPL-3.0 授权（源码仍 Apache-2.0）。详见 NOTICE。
  # 不支持 Flutter Web（lib/ 内 39 处无条件 import 'dart:ffi'），故 Web 端
  # 永久保留 iframe 路径。
  webf: ^0.24.27
  # webf-ui 的 Cupertino 原生元素（31 个 `<flutter-cupertino-*>`），供声明
  # `renderEngine: "webf"` 的插件页使用（songloft-org/songloft#341）。
  # 许可：**Apache-2.0**（以包内 LICENSE 为准；npm 侧同名包的元数据写 ISC 是错的），
  # 不引入新的 copyleft —— 本客户端整体按 GPL-3.0 分发的原因只有上面的 webf。
  # 它 depend on `webf ^0.24.0`，与这里锁定的 0.24.27 兼容。
  # ⚠️ `<webf-list-view>` **不在这个包里**，是 webf 包内建的（`src/html/listview.dart`），
  # 所以只用列表的插件不需要这个依赖。
  webf_cupertino_ui: ^0.4.1
  # `<flutter-cupertino-icon>` 的字体。**必须在这里显式声明** ——
  # `webf_cupertino_ui` 自己没有依赖它（它的 pubspec 只有 flutter/webf/logger/
  # collection），这是那个包的打包遗漏。因果链：它的
  # `cupertino_icons_map_generated.dart` 取值全是 `CupertinoIcons.xxx`，而那些常量是
  # `IconData(0xf43c, fontFamily: 'CupertinoIcons', fontPackage: 'cupertino_icons')`
  # —— 字体文件由 `cupertino_icons` 包的 pubspec 声明，不列进依赖，
  # `CupertinoIcons.ttf` 就不进 assets。
  # 症状**不是「图标不显示」而是画成一个 `?` 方框**：那些码点在私用区，缺字体时由
  # 系统兜底字体（macOS 是 LastResort）渲染成「未知字符」占位符，不报错、不打日志。
  # 别把它误判成「图标名写错」—— `icon.dart` 对查不到的 type 返回
  # `SizedBox.shrink()`，名字写错是**看不见**，不是问号（songloft-org/songloft#341 实测）。
  cupertino_icons: ^1.0.8
  web: ^1.1.1
  json_annotation: ^4.9.0
  # 系统音量控制
  volume_controller: ^2.0.7
  # 窗口和系统托盘
  window_manager: ^0.5.2
  tray_manager: ^0.2.4
  windows_single_instance: any
  # 桌面歌词悬浮窗：同进程内起独立 Flutter engine 作为悬浮窗（songloft-org/songloft#318）
  desktop_multi_window: ^0.3.0
  # 获取显示器几何信息（含位置），用于桌面歌词悬浮窗位置的边界校验
  screen_retriever: ^0.2.2
  flutter_svg: ^2.3.0
  # HMAC-SHA256 签名（Tracely 监控 SDK）
  crypto: ^3.0.6
  # DLNA 投屏
  dlna_dart: ^0.1.1
  # Android 自托管热更新（冷启动整包替换 libapp.so，仅 Android，其余平台 no-op）
  flutter_patcher: ^0.1.3
  # 桌面小组件（Android App Widget / iOS WidgetKit）
  home_widget: ^0.7.0

dependency_overrides:
  # smtc_windows 1.1.0 的 Rust codegen 使用 flutter_rust_bridge 2.11.1 编译，
  # 但 ^2.11.1 约束允许解析到 2.12.0，导致 codegen/runtime 版本不匹配。
  flutter_rust_bridge: 2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.0+1
  build_runner: ^2.4.14
  json_serializable: ^6.9.3
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  # Android launcher icon 生成器（其他平台仍由 scripts/generate-icons.sh 直接从 SVG 渲染）
  flutter_launcher_icons: ^0.14.4

# 接管 Android / iOS / macOS 原生图标。
# Windows ICO（多分辨率 16-256）和 Web PWA 由 scripts/generate-icons.sh 直接从 SVG 渲染，
# 这里 generate=false 避免被覆盖为单尺寸或丢失 maskable / 修改 manifest 颜色。
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"
  windows:
    generate: false
  web:
    generate: false
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  # Adaptive icon (Android 8.0+)：白底 + 与主图相同的前景，自带 16% inset
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  # Themed icon (Android 13+)：单色版本，跟随系统壁纸主题
  adaptive_icon_monochrome: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/app_icon.png
    - windows/runner/resources/app_icon.ico
    # 插件页图标字体（songloft-org/songloft#341）。刻意声明为 asset 而非
    # fonts: 条目 —— 它只在 WebF 渲染引擎下由 PluginRenderFonts 用 FontLoader
    # 按需注册，不进 App 自身的字体表，避免影响应用排版。
    - fonts/material-symbols-outlined.ttf
    # 许可文本（songloft-org/songloft#341）。GPLv3 §4/§5 要求「随附」许可全文，
    # 而我们的二进制链接了 GPL-3.0-only 的 WebF，故整体按 GPL-3.0 分发。
    # 声明为 Flutter asset 是唯一能一次覆盖全部平台、且**完全不碰签名流程**的做法：
    # asset 在 `flutter build` 阶段就进了 flutter_assets/，签名（APK/IPA/DMG/MSIX）
    # 发生在那之后，所以不存在破坏签名的风险。设置 → 关于 → 开源许可页读它们，
    # 因此离线设备上也能看到完整许可全文，不依赖外链。
    - LICENSES/GPL-3.0.txt
    - NOTICE
    - assets/legal/TERMS.md
    - assets/legal/TERMS.en.md
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: fonts/NotoSansSC-Regular.otf