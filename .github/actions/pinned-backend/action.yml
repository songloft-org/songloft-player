name: Checkout pinned Songloft backend
description: Fetch the public backend commit fixed by mobile-backend.lock.json and initialize its tag dependency.
outputs:
  commit:
    description: Pinned backend commit SHA
    value: ${{ steps.pin.outputs.commit }}
  version:
    description: Pinned backend semantic version
    value: ${{ steps.pin.outputs.version }}
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: |
        set -euo pipefail
        node -e 'const p=require("./mobile-backend.lock.json");if(p.repository!=="https://github.com/songloft-org/songloft.git"||p.package!=="mobile"||!/^[0-9a-f]{40}$/.test(p.commit)||!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(p.version))process.exit(1);console.log(`commit=${p.commit}`);console.log(`version=${p.version}`)' >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v4
      with:
        repository: songloft-org/songloft
        ref: ${{ steps.pin.outputs.commit }}
        path: backend-source
        persist-credentials: false
    - uses: actions/setup-go@v5
      with:
        go-version: "1.26.x"
        cache-dependency-path: backend-source/go.sum
    - shell: bash
      working-directory: backend-source
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "${{ steps.pin.outputs.commit }}"
        GIT_TERMINAL_PROMPT=0 git submodule update --init --depth 1 pkg/tag
        go doc ./mobile | sed -n '/^func /p' | sort > "$RUNNER_TEMP/mobile-export-surface.txt"
        sort mobile/export_surface.txt > "$RUNNER_TEMP/mobile-export-surface.expected"
        diff -u "$RUNNER_TEMP/mobile-export-surface.expected" "$RUNNER_TEMP/mobile-export-surface.txt"
