<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Songloft - 跨平台音乐播放器">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Songloft">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Songloft</title>
  <link rel="manifest" href="manifest.json">

  <!-- ── 视口滚动条防线（songloft-org/songloft#439，#278 未尽根因）──
       引擎的 FullPageEmbeddingStrategy 只给 <body> 设了 position:fixed + inset:0 +
       overflow:hidden，`<html>` 仍是默认 overflow:visible。于是只要有任何东西把文档
       撑破几个像素（浏览器扩展注入到 <html> 的浮层等），在「经典滚动条占布局宽度」的
       系统（Windows Chrome）上就会形成每帧回路：滚动条出现 → 视口窄 15px → 跟着
       视口定尺寸的 body 变窄 → Flutter 整页按新尺寸重排 → 不再溢出 → 滚动条消失 →
       …，肉眼即整页 ~15Hz 抖动（首页 / 曲库 / 插件商店 / 插件页全中）。
       宿主页永远不需要文档级滚动（Flutter 视图是 fixed 全屏，滚动全在应用内），故
       直接禁掉；再把滚动条宽度归零做二道保险，即使将来文档又能滚也不占布局宽度。
       插件 iframe 侧的同类防线见 internal/jsplugin/assets/theme.css 的 html.embed。 -->
  <style>
    html { overflow: hidden; scrollbar-width: none; }
    html::-webkit-scrollbar { width: 0; height: 0; display: none; }
  </style>

</head>
<body>
  <!-- NextConsole 调试面板：在设置页面启用后，刷新页面自动加载。
       读取 localStorage 中 flutter.web_debug_console 的值决定是否激活。 -->
  <script>
  (function () {
    try {
      var enabled = false;
      try { enabled = localStorage.getItem('flutter.web_debug_console') === 'true'; } catch (_) {}
      if (!enabled) return;
      var s = document.createElement('script');
      s.src = 'nextconsole.umd.js';
      s.onload = function () {
        try {
          // 官方 UMD 产物的全局 window.NextConsole 是命名空间对象
          // ({ NextConsole: 类, default: 类, ... })，并非构造函数本身；
          // 官方 README 的 `new NextConsole()` 示例在 UMD 下会抛
          // TypeError。取命名空间里的类再实例化。
          var ns = window.NextConsole;
          var Ctor = (ns && (ns.NextConsole || ns.default)) || ns;
          new Ctor({ theme: 'dark' });
        } catch (e) { console.error('[NextConsole] init failed', e); }
      };
      document.head.appendChild(s);
    } catch (_) {}
  })();
  </script>
  <script src="equalizer.js"></script>
  <script src="hls.min.js"></script>
  <script src="hls_bridge.js"></script>
  <script src="deploy-mode.js"></script>
  <!--
    WebGL context 丢失相关:GPU 显存压力 / 切后台时 CanvasKit 可能丢失 WebGL context。
    引擎 bug flutter/flutter#184683(丢失时访问未初始化 late 字段抛 LateInitializationError
    → 渲染帧崩溃 / 白屏)已由官方修复 #185116 解决,web 构建已切到含该修复的 beta 3.47
    (见 .github/workflows/build-and-release.yml)。离屏封面残留的死纹理则由应用侧
    installWebGLContextRecovery(context 丢失/恢复时清空 imageCache)兜底,见
    songloft-org/songloft#309。页面侧的渲染器强制/恢复绕法已移除。
  -->
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    var config = {
      // 不强制变体,由引擎按浏览器自动选择(canvasKitVariant 默认 auto):
      // Chromium 内核用体积更小的 chromium 变体,Firefox / Safari 用 full 变体。
      // 与 CPU/GPU 渲染模式无关,两种变体都走 WebGL。embedded 自托管构建会保留
      // canvaskit/chromium 子目录(见 scripts/build-frontend.sh),确保离线也能加载。
      canvasKitVariant: "auto",
    };

    if (typeof _deployMode !== 'undefined' && _deployMode === 'embedded') {
      config.fontFallbackBaseUrl = "fonts/";
    }

    _flutter.loader.load({ config: config });
  </script>
</body>
</html>
